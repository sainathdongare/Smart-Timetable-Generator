<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 750" width="680" height="750">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #0f172a; stroke-width: 1.75; }
      .box-alt { fill: #f8fafc; stroke: #0f172a; stroke-width: 1.75; }
      .decision { fill: #ffffff; stroke: #0f172a; stroke-width: 1.75; }
      .terminal { fill: #f1f5f9; stroke: #0f172a; stroke-width: 2; }
      .arrow { stroke: #0f172a; stroke-width: 1.75; fill: none; marker-end: url(#arrowhead); }
      .arrow-loop { stroke: #0f172a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrowhead); }
      .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #334155; text-anchor: middle; }
      .text-italic { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-style: italic; fill: #64748b; text-anchor: middle; }
      .label-decision { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="680" height="750" class="bg" />

  <!-- 1. Start Node -->
  <rect x="240" y="30" width="200" height="40" rx="20" ry="20" class="terminal" />
  <text x="340" y="55" class="text-title">Start</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="340" y1="70" x2="340" y2="98" class="arrow" />

  <!-- 2. Prepare Test Inputs -->
  <rect x="150" y="98" width="380" height="44" class="box" />
  <text x="340" y="125" class="text-body" font-weight="bold">Prepare Test Inputs</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="340" y1="142" x2="340" y2="170" class="arrow" />

  <!-- 3. Run Timetable Generation -->
  <rect x="150" y="170" width="380" height="44" class="box-alt" />
  <text x="340" y="197" class="text-body" font-weight="bold">Run Timetable Generation</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="340" y1="214" x2="340" y2="242" class="arrow" />

  <!-- 4. Check Generated Timetable -->
  <rect x="150" y="242" width="380" height="44" class="box" />
  <text x="340" y="269" class="text-body" font-weight="bold">Check the Generated Timetable</text>

  <!-- Arrow 4 -> 5 -->
  <line x1="340" y1="286" x2="340" y2="315" class="arrow" />

  <!-- 5. Decision Diamond: Validation Checks Passed? -->
  <polygon points="340,315 485,352 340,389 195,352" class="decision" />
  <text x="340" y="348" class="text-body" font-weight="bold">Are Validation Checks</text>
  <text x="340" y="362" class="text-body" font-weight="bold">Passed?</text>

  <!-- Branch No: 5 -> 6 (Refine & Rerun) -->
  <line x1="485" y1="352" x2="525" y2="352" class="arrow" />
  <text x="502" y="342" class="label-decision">No</text>

  <rect x="525" y="325" width="135" height="54" class="box" />
  <text x="592" y="345" class="text-body" font-weight="bold">Identify Conflicts &amp;</text>
  <text x="592" y="358" class="text-body">Refine Inputs/Code;</text>
  <text x="592" y="371" class="text-italic">Rerun Test</text>

  <!-- Loop back from 6 to 3 -->
  <polyline points="592,325 592,192 530,192" class="arrow-loop" />

  <!-- Branch Yes: 5 -> 7 -->
  <line x1="340" y1="389" x2="340" y2="425" class="arrow" />
  <text x="355" y="408" class="label-decision">Yes</text>

  <!-- 7. Verify Schedules -->
  <rect x="140" y="425" width="400" height="48" class="box" />
  <text x="340" y="446" class="text-body" font-weight="bold">Verify Faculty, Classroom &amp; Class Schedules</text>
  <text x="340" y="462" class="text-italic">(Cross-check professor loads, lab occupancy &amp; student grids)</text>

  <!-- Arrow 7 -> 8 -->
  <line x1="340" y1="473" x2="340" y2="502" class="arrow" />

  <!-- 8. Check Unscheduled Sessions & Diagnostics -->
  <rect x="140" y="502" width="400" height="48" class="box-alt" />
  <text x="340" y="523" class="text-body" font-weight="bold">Check for Unscheduled Sessions &amp; Diagnostic Messages</text>
  <text x="340" y="539" class="text-italic">(Review conflict log, bottleneck notices &amp; open periods)</text>

  <!-- Arrow 8 -> 9 -->
  <line x1="340" y1="550" x2="340" y2="580" class="arrow" />

  <!-- 9. Record Test Results -->
  <rect x="150" y="580" width="380" height="44" class="box" />
  <text x="340" y="607" class="text-body" font-weight="bold">Record Test Results</text>

  <!-- Arrow 9 -> 10 -->
  <line x1="340" y1="624" x2="340" y2="655" class="arrow" />

  <!-- 10. End Node -->
  <rect x="240" y="655" width="200" height="40" rx="20" ry="20" class="terminal" />
  <text x="340" y="680" class="text-title">End</text>
</svg>
