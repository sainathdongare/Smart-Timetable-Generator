spring.application.name=smart-timetable-backend

# Default Embedded Database (H2) - For MySQL, activate profile: spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/smart_timetable_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
