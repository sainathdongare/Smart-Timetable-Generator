<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="8" y1="10" x2="40" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#090d16" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern App Icon Squircle Background -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#brandGrad)"/>

  <!-- Calendar Page Base with slight shadow -->
  <rect x="8" y="10" width="32" height="30" rx="5" fill="#ffffff" filter="url(#dropShadow)"/>

  <!-- Calendar Header Band -->
  <path d="M8 15C8 12.2386 10.2386 10 13 10H35C37.7614 10 40 12.2386 40 15V18H8V15Z" fill="url(#headerGrad)"/>

  <!-- Twin Binder Pins / Rings -->
  <rect x="14" y="6" width="3" height="7" rx="1.5" fill="#f8fafc"/>
  <rect x="31" y="6" width="3" height="7" rx="1.5" fill="#f8fafc"/>

  <!-- Timetable Grid Matrix / Schedule Blocks -->
  <!-- Row 1 -->
  <rect x="12" y="22" width="7" height="5" rx="1.5" fill="#2563eb"/>
  <rect x="20.5" y="22" width="7" height="5" rx="1.5" fill="#93c5fd"/>
  <rect x="29" y="22" width="7" height="5" rx="1.5" fill="#38bdf8"/>

  <!-- Row 2 -->
  <rect x="12" y="29.5" width="7" height="5" rx="1.5" fill="#cbd5e1"/>
  <rect x="20.5" y="29.5" width="7" height="5" rx="1.5" fill="#1d4ed8"/>
  <rect x="29" y="29.5" width="7" height="5" rx="1.5" fill="#38bdf8"/>

  <!-- System active indicator dot -->
  <circle cx="36" cy="36" r="2.5" fill="#10b981"/>
</svg>